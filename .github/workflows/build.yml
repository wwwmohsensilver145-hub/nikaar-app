name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Android SDK manually
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools android-sdk/cmdline-tools/latest
        echo "ANDROID_HOME=${PWD}/android-sdk" >> $GITHUB_ENV
        echo "PATH=${PWD}/android-sdk/cmdline-tools/latest/bin:${PATH}" >> $GITHUB_ENV

    - name: Accept Android licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

    - name: Install Node dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Sync Capacitor with Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Fix gradlew permissions
      run: chmod +x android/gradlew

    - name: Clean Gradle cache
      run: rm -rf ~/.gradle/caches/

    - name: Build APK with debug info
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace --info --no-build-cache

    - name: Verify APK exists
      run: |
        if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "✅ APK built successfully!"
          ls -la android/app/build/outputs/apk/debug/
        else
          echo "❌ APK not found!"
          find android/app/build/outputs -name "*.apk" || echo "No APK files found"
          exit 1
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
