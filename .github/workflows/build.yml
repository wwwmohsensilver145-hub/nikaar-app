name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node dependencies
      run: npm install

    - name: Install cordova-android bridge
      run: npm install cordova-android@13.0.0 --no-save

    - name: Fix permissions
      run: chmod +x node_modules/.bin/vite node_modules/.bin/cap

    - name: Build web app
      run: npm run build

    - name: Remove old android folder
      run: rm -rf android

    - name: Add fresh Android platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Wire CordovaLib into the build
      run: |
        set +e
        SETTINGS=android/settings.gradle
        if ! grep -q "CordovaLib" "$SETTINGS"; then
          printf '\ninclude ":CordovaLib"\nproject(":CordovaLib").projectDir = new File(rootProject.projectDir, "../node_modules/cordova-android/framework")\n' >> "$SETTINGS"
        fi
        CAP_GRADLE=node_modules/@capacitor/android/capacitor/build.gradle
        if ! grep -q "CordovaLib" "$CAP_GRADLE"; then
          sed -i '/^dependencies {/a\    implementation project(":CordovaLib")' "$CAP_GRADLE"
        fi

    - name: Create init script to force official Google repo everywhere
      run: |
        cat > fix-repos.init.gradle <<'EOF'
        settingsEvaluated { settings ->
            settings.pluginManagement {
                repositories {
                    clear()
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
        }
        allprojects {
            afterEvaluate { project ->
                project.buildscript.repositories.clear()
                project.buildscript.repositories.google()
                project.buildscript.repositories.mavenCentral()
                project.repositories.clear()
                project.repositories.google()
                project.repositories.mavenCentral()
            }
        }
        EOF

    - name: Fix gradlew permission
      run: chmod +x android/gradlew

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK
      run: cd android && ./gradlew --init-script ../fix-repos.init.gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
