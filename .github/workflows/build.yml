name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node dependencies
      run: npm install

    - name: Fix permissions
      run: |
        chmod +x node_modules/.bin/vite
        chmod +x node_modules/.bin/cap
        chmod +x android/gradlew

    - name: Build web app
      run: npm run build

    - name: Create assets directory
      run: mkdir -p android/app/src/main/assets

    - name: Copy web assets to Android
      run: npx cap copy android

    - name: Update Android plugins
      run: npx cap update android || true

    - name: Sync Capacitor
      run: npx cap sync android || true

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --warning-mode all
      continue-on-error: false

    - name: Find APK
      run: find android/app/build/outputs/apk -name "*.apk" || true

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
