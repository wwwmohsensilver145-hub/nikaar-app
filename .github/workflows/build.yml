name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node dependencies
      run: npm install

    - name: Fix permissions
      run: chmod +x node_modules/.bin/vite node_modules/.bin/cap

    - name: Build web app
      run: npm run build

    - name: Remove old android folder
      run: rm -rf android

    - name: Add fresh Android platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Replace broken aliyun mirror with official Google repo
      run: |
        find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -e '/aliyun/{s/.*/google()/;a\mavenCentral()}' {} \;
        echo "=== Checking remaining aliyun ==="
        grep -rn "aliyun" android || echo "All aliyun removed successfully!"

    - name: Fix gradlew permission
      run: chmod +x android/gradlew

    - name: Accept Android licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK
      run: cd android && ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
