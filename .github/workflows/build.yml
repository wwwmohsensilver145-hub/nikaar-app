name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # تغییر به نسخه پایدار LTS برای جلوگیری از ناسازگاری
        cache: 'npm'

    - name: Install Node dependencies
      # نکته: اگر فایل package-lock.json را در ریپازیتوری ندارید، این خط را به npm install تغییر دهید
      run: npm ci 

    - name: Fix permissions
      run: |
        chmod +x node_modules/.bin/vite || true
        chmod +x node_modules/.bin/cap || true
        chmod +x android/gradlew

    - name: Build web app
      run: npm run build

    - name: Sync Capacitor
      # حذف || true برای اینکه اگر سینک Capacitor به مشکل خورد، بیلد متوقف شود
      run: npx cap sync android

    - name: Accept Android licenses
      run: |
        # روش استاندارد برای پذیرش لایسنس‌ها در اوبونتو
        yes | sdkmanager --licenses || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      env:
        # افزایش حافظه برای جلوگیری از کرش کردن Gradle در سرورهای گیت‌هاب
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --warning-mode all

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        # استفاده از wildcard تا اگر نام فایل تغییر کرد، آپلود با خطا مواجه نشود
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
