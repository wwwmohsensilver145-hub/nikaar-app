name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Install web deps
      run: npm install

    - name: Fix vite permission
      run: chmod +x node_modules/.bin/vite

    - name: Build web app
      run: npm run build

    - name: Create clean Android project
      run: |
        rm -rf android
        mkdir -p android/app/src/main/java/com/nikaar/app
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/assets/www

        cat > android/settings.gradle <<'EOF'
        rootProject.name = "nikaar"
        include ':app'
        EOF

        cat > android/build.gradle <<'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat > android/gradle.properties <<'EOF'
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        cat > android/app/build.gradle <<'EOF'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.nikaar.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.nikaar.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }
        EOF

        cat > android/app/src/main/AndroidManifest.xml <<'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="Nikaar" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat > android/app/src/main/java/com/nikaar/app/MainActivity.java <<'EOF'
        package com.nikaar.app;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebSettings;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                setContentView(webView);
                WebSettings s = webView.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setAllowFileAccess(true);
                s.setAllowFileAccessFromFileURLs(true);
                s.setAllowUniversalAccessFromFileURLs(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/www/index.html");
            }
        }
        EOF

        cat > android/app/src/main/res/values/strings.xml <<'EOF'
        <resources><string name="app_name">Nikaar</string></resources>
        EOF

    - name: Copy web build into assets
      run: cp -r dist/. android/app/src/main/assets/www/

    - name: Build APK
      run: cd android && gradle assembleDebug --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
