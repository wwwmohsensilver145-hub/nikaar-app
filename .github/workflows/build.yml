name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Android SDK (Minimal)
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          build-tools;34.0.0
          platforms;android-34

    - name: Install Node dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Sync Capacitor with Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Fix gradlew permissions
      run: chmod +x android/gradlew

    - name: Accept Android licenses
      run: yes | sdkmanager --licenses || true

    - name: Clean Gradle cache
      run: rm -rf ~/.gradle/caches/

    - name: Build APK with debug info
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace --info --no-build-cache

    - name: Verify APK exists
      run: |
        if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "✅ APK built successfully!"
          ls -la android/app/build/outputs/apk/debug/
        else
          echo "❌ APK not found!"
          find android/app/build/outputs -name "*.apk" || echo "No APK files found"
          exit 1
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
